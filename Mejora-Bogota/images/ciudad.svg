    <path d="M387 235h22v27h-22zm42 0h22v27h-22zm-42 46h22v27h-22zm42 0h22v27h-22z"/>
  </g>
  <path d="M112 320h31v45h-31zm151-6h30v51h-30zm143 12h30v39h-30z" fill="#304858"/>
