  <circle cx="530" cy="254" r="37" fill="#087b52"/>
  <circle cx="660" cy="237" r="42" fill="#087b52"/>
  <path d="M590 285v100" stroke="#333333" stroke-width="9"/>
  <rect x="573" y="220" width="34" height="80" rx="8" fill="#333333"/>
  <circle cx="590" cy="237" r="8" fill="#ef3340"/>
  <circle cx="590" cy="260" r="8" fill="#ffd700"/>
  <circle cx="590" cy="283" r="8" fill="#3ba935"/>
