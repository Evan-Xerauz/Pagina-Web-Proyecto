  <path d="M0 225 130 100 230 190 355 80 520 215 620 155 720 225V350H0Z" fill="#a7d5b5"/>
  <path d="m230 225 125-145 165 135 100-60 100 70v125H230Z" fill="#76b88e"/>
  <!-- Edificios -->
  <rect x="70" y="190" width="115" height="175" rx="4" fill="#0756a3"/>
  <rect x="215" y="140" width="125" height="225" rx="4" fill="#f1bd51"/>
  <rect x="370" y="215" width="105" height="150" rx="4" fill="#65abc3"/>
