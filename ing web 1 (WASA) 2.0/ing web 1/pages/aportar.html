<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FixGuide — Aportar</title>
    <link rel="stylesheet" href="../css/style.css">
</head>
<body>

    <header class="navbar">
        <div class="logo"><strong>Fix<span>Guide</span></strong></div>
        <nav class="nav-links">
            <a href="index.html">Inicio</a>
            <a href="guias.html">Guías</a>
            <a href="verguia.html">Ver guía</a>
            <a href="aportar.html" class="active">Aportar</a>
        </nav>
        <div class="nav-btn">
            <a href="aportar.html" class="btn-primary">+ Aportar</a>
        </div>
    </header>

    <main class="container-main form-container">
        <nav class="breadcrumbs" aria-label="Migas de pan">
            <a href="index.html">Inicio</a> > <span>Aportar / Sugerencia</span>
        </nav>

        <section class="form-header">
            <h1>Aportar / Sugerir</h1>
            <p>¿Sabes reparar algo que aún no está en nuestra base de guías? Cuéntanos los detalles.</p>
        </section>

        <div class="form-tabs">
            <button class="tab-btn active" type="button">Sugerir nueva guía</button>
            <button class="tab-btn" type="button">Comentario sobre guía</button>
        </div>

        <form class="contribution-form">
            <div class="form-row">
                <div class="form-group">
                    <label for="nombre">NOMBRE *</label>
                    <input type="text" id="nombre" placeholder="Tu nombre" required>
                </div>
                <div class="form-group">
                    <label for="correo">CORREO *</label>
                    <input type="email" id="correo" placeholder="tu@correo.com" required>
                </div>
            </div>

            <div class="form-group">
                <label for="tipo">TIPO DE APORTE *</label>
                <select id="tipo" required>
                    <option value="">Seleccionar...</option>
                    <option value="portatil">Portátil</option>
                    <option value="celular">Celular</option>
                    <option value="consola">Consola</option>
                </select>
            </div>

            <div class="form-group">
                <label for="dispositivo">DISPOSITIVO A REPARAR *</label>
                <input type="text" id="dispositivo" placeholder="Ej: Lenovo IdeaPad 3" required>
            </div>

            <fieldset class="form-group">
                <legend style="font-size: 0.75rem; font-weight: bold; margin-bottom: 8px;">NIVEL DE DIFICULTAD ESTIMADO</legend>
                <div class="radio-group">
                    <label><input type="radio" name="dificultad" checked> Principiante</label>
                    <label><input type="radio" name="dificultad"> Intermedio</label>
                    <label><input type="radio" name="dificultad"> Avanzado</label>
                </div>
            </fieldset>

            <div class="form-group">
                <label for="descripcion">DESCRIPCIÓN DETALLADA *</label>
                <textarea id="descripcion" rows="5" placeholder="Describe la reparación y pasos generales..." required></textarea>
            </div>

            <button type="submit" class="btn-submit">Enviar aporte</button>
        </form>
    </main>

    <footer class="footer">
        <div class="footer-bottom center">
            <p>© 2026 FixGuide — Contenido bajo licencia CC BY-SA 4.0</p>
        </div>
    </footer>

</body>
</html>
